# Local render of ansible/roles/haproxy-lb (VM22). TCP 6443 -> lab cluster
# API (master-01), stats on :9000 with prometheus-exporter route.
global
    log stdout format raw local0
    maxconn 5000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend k8s-api
    bind :6443
    default_backend k8s_control_plane

backend k8s_control_plane
    balance leastconn
    option tcp-check
    tcp-check connect ssl
    tcp-check send "GET /readyz HTTP/1.0\r\n"
    tcp-check send "Host: localhost\r\n"
    tcp-check send "\r\n"
    tcp-check expect rstring "ok"
    server master-01 devops-platform-control-plane:6443 check inter 5s fall 3 rise 2 verify none
    server master-01-bak devops-platform-control-plane:6443 check inter 5s fall 3 rise 2 verify none

listen stats
    bind :9000
    mode http
    stats enable
    stats uri /stats
    stats realm Haproxy\ Statistics
    stats auth admin:admin
    http-request use-service prometheus-exporter if { path /metrics }
