---
name: enterprise-devops-local

# Local 1:1 emulation of the 25-VM platform for PC testing before cloud.
# VM mapping:
#   VM17 pg-primary        -> postgres-primary   (postgres:16, wal_level=replica)
#   VM18 pg-replica        -> postgres-replica   (pg_basebackup + standby.signal)
#   VM19 prometheus        -> prometheus         (scrapes cluster + exporters)
#   VM20 grafana           -> grafana            (dashboards from monitoring/)
#   VM22 haproxy-lb        -> haproxy            (TCP 6443 -> lab cluster API)
#   VM21 nginx-lb          -> nginx              (HTTP -> ingress NodePort 30080)
#   VM05 jenkins-master    -> jenkins            (plugins + prometheus endpoint)
#   VM01-25 node_exporter  -> node-exporter      (single instance stands in)
#   VM17-18 pg exporter    -> postgres-exporter  (one per postgres instance)
# Run:  ./setup.sh && docker compose -f local/docker-compose.yml up -d
# Test: ./scripts/local-validate.sh

networks:
  lab:
    driver: bridge
  kind:
    external: true

services:
  postgres-primary:
    image: postgres:16
    container_name: vm17-pg-primary
    env_file: ../.env
    environment:
      POSTGRES_PASSWORD: ${PG_APP1_PASSWORD:-changeme}
      POSTGRES_USER: app1
      POSTGRES_DB: app1
      PG_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-changeme}
      PG_MONITORING_PASSWORD: ${PG_MONITORING_PASSWORD:-changeme}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - listen_addresses=*
    volumes:
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./postgres/02-pghba.sh:/docker-entrypoint-initdb.d/02-pghba.sh:ro
    ports:
      - "55432:5432"
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app1 -d app1"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-replica:
    image: postgres:16
    container_name: vm18-pg-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file: ../.env
    environment:
      PGPASSWORD: ${PG_REPLICATION_PASSWORD:-changeme}
      PRIMARY_HOST: postgres-primary
    command:
      - bash
      - -c
      - |
        set -e
        until pg_isready -h postgres-primary -U replicator >/dev/null 2>&1; do sleep 2; done
        rm -rf "${PGDATA:-/var/lib/postgresql/data}"/*
        pg_basebackup -h postgres-primary -U replicator -D "${PGDATA:-/var/lib/postgresql/data}" -R -P -S replica_slot_local
        exec docker-entrypoint.sh postgres -c hot_standby=on -c wal_receiver_status_interval=10s -c listen_addresses=*
    ports:
      - "55433:5432"
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app1 -d app1 -h postgres-replica"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-exporter-primary:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vm17-postgres-exporter
    env_file: ../.env
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${PG_MONITORING_PASSWORD:-changeme}@postgres-primary:5432/postgres?sslmode=disable"
    ports:
      - "19187:9187"
    networks: [lab]
    depends_on: [postgres-primary]

  postgres-exporter-replica:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: vm18-postgres-exporter
    env_file: ../.env
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${PG_MONITORING_PASSWORD:-changeme}@postgres-replica:5432/postgres?sslmode=disable"
    ports:
      - "19188:9187"
    networks: [lab]
    depends_on: [postgres-replica]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: vm-node-exporter
    pid: host
    restart: unless-stopped
    ports:
      - "19100:9100"
    networks: [lab]

  haproxy:
    image: haproxy:2.9-alpine
    container_name: vm22-haproxy-lb
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "6443:6443"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks: [lab, kind]

  nginx:
    image: nginx:alpine
    container_name: vm21-nginx-lb
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks: [lab, kind]

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vm19-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/run/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/run/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./prometheus/run/kubeconfig:/etc/prometheus/kubeconfig:ro
      - ./prometheus/run/ca.crt:/etc/prometheus/ca.crt:ro
      - ./prometheus/run/client.crt:/etc/prometheus/client.crt:ro
      - ./prometheus/run/client.key:/etc/prometheus/client.key:ro
    ports:
      - "9090:9090"
    networks: [lab, kind]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.2.2
    container_name: vm20-grafana
    env_file: ../.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [lab]
    depends_on: [prometheus]

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: vm05-jenkins-master
    environment:
      JAVA_OPTS: -Dhudson.model.DownloadService.noSignatureCheck=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
    ports:
      - "8081:8080"
      - "50000:50000"
    networks: [lab]

volumes:
  jenkins-home:
