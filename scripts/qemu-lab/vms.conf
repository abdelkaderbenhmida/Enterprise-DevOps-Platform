"vm05|jenkins-master|jenkins controller|3072|2|22205|01-common.yml 02-docker.yml 05-jenkins.yml"
"vm06|jenkins-agent1|jenkins agent|2048|2|22206|01-common.yml 02-docker.yml 05-jenkins.yml"
"vm07|jenkins-agent2|jenkins agent|2048|2|22207|01-common.yml 02-docker.yml 05-jenkins.yml"
