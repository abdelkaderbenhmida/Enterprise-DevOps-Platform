#!/usr/bin/env bash
# scripts/qemu-lab/vms.conf — the 25-VM inventory for the QEMU lab.
# One VM at a time: create -> boot -> ansible config -> per-VM test -> shutdown.
#
# Format (pipe-separated):
#   vmnum|hostname|role|ram_mb|vcpus|ssh_port|ansible_playbooks(space-sep)
#
# ssh_port = host port forwarded to VM :22. Must be unique across the lab.
# ansible_playbooks = playbooks from ansible/playbooks/ to run for this VM.
# NOTE: single-VM mode — HA-only steps (kubeadm join, pg_basebackup,
# keepalived VRRP) need multiple VMs and are documented in the test output.

VMS=(
"vm01|bastion|ssh gateway|2048|2|22201|01-common.yml"
