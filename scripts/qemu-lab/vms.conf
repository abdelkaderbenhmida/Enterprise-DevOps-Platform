"vm11|k8s-wk1|k8s worker|2048|2|22211|01-common.yml 02-docker.yml 04-k8s-workers.yml"
"vm12|k8s-wk2|k8s worker|2048|2|22212|01-common.yml 02-docker.yml 04-k8s-workers.yml"
