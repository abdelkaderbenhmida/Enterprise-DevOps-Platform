---
# Helm values for ingress-nginx (NOT a kubectl manifest).
# Apply with: helm upgrade --install ingress-nginx ingress-nginx \
#   --repo https://kubernetes.github.io/ingress-nginx \
#   --namespace ingress-nginx -f kubernetes/ingress/ingress-controller-values.yml
controller:
  replicaCount: 2
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  config:
    proxy-body-size: "50m"
    proxy-read-timeout: "300"
    proxy-send-timeout: "300"
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
  extraArgs:
    default-ssl-certificate: "ingress-nginx/tls-secret"
  publishService:
    enabled: true
  ingressClassResource:
    default: true
    name: nginx
    controllerValue: "k8s.io/ingress-nginx"

defaultBackend:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

tcp: {}
udp: {}
