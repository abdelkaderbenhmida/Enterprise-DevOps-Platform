---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-backend
  namespace: app1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app1-backend
  template:
    metadata:
      labels:
        app: app1-backend
    spec:
      containers:
      - name: backend
        # Replaced at deploy time by Jenkins (commit-sha tag) or
        # local/k8s/deploy-to-kind.sh. Change <your-org> to the real GHCR org.
        # Never use :latest — it breaks rollback and rolling-update determinism.
        image: ghcr.io/your-org/app1-backend:v1.0.0
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: app1-config
        - secretRef:
            name: app1-secrets
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
