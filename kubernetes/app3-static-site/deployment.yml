---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-static
  namespace: app3
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app3-static
  template:
    metadata:
      labels:
        app: app3-static
    spec:
      containers:
      - name: static
        # Replaced at deploy time by Jenkins (commit-sha tag) or
        # local/k8s/deploy-to-kind.sh. Change <your-org> to the real GHCR org.
        # Never use :latest — it breaks rollback and rolling-update determinism.
        image: ghcr.io/your-org/app3-static:v1.0.0
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "25m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
