---
postgresql_primary_host: "vm17-pg-primary"
postgresql_replica_host: "vm18-pg-replica"
postgresql_port: 5432
postgresql_replication_user: "replicator"
postgresql_replication_password: "{{ lookup('env', 'PG_REPLICATION_PASSWORD') | default('changeme', true) }}"
postgresql_app1_db: "app1"
postgresql_app1_user: "app1"
postgresql_app1_password: "{{ lookup('env', 'PG_APP1_PASSWORD') | default('changeme', true) }}"
postgresql_monitoring_user: "monitoring"
postgresql_monitoring_password: "{{ lookup('env', 'PG_MONITORING_PASSWORD') | default('changeme', true) }}"
