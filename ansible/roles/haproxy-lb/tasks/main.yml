---
- name: Ensure haproxy is installed
  apt:
    name: haproxy
    state: present
    update_cache: yes

- name: Deploy haproxy.cfg template
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
  notify: restart haproxy

- name: Enable and start haproxy
  systemd:
    name: haproxy
    enabled: yes
    state: started

- name: Install keepalived for VIP failover
  apt:
    name: keepalived
    state: present

- name: Deploy keepalived config (master)
  template:
    src: keepalived-master.conf.j2
    dest: /etc/keepalived/keepalived.conf
  when: groups.get('haproxy_lb', []) | first | default(inventory_hostname) == inventory_hostname
  notify: restart keepalived

- name: Deploy keepalived config (backup)
  template:
    src: keepalived-backup.conf.j2
    dest: /etc/keepalived/keepalived.conf
  when: groups.get('haproxy_lb', []) | length > 1 and inventory_hostname == groups['haproxy_lb'][1]
  notify: restart keepalived

- name: Enable and start keepalived
  systemd:
    name: keepalived
    enabled: yes
    state: started

- name: Configure sysctl for VIP
  copy:
    dest: /etc/sysctl.d/99-keepalived.conf
    content: |
      net.ipv4.ip_nonlocal_bind = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl
  command: sysctl --system
