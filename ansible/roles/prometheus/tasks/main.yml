---
- name: Create prometheus user
  user:
    name: prometheus
    shell: /bin/false
    home: /var/lib/prometheus
    system: yes

- name: Create prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus
    - /var/lib/prometheus/data

- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /tmp/prometheus.tar.gz
    mode: '0644'

- name: Extract Prometheus
  unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install Prometheus binaries
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: yes
    mode: '0755'
  loop:
    - prometheus
    - promtool

- name: Install Prometheus console files
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/{{ item }}"
    remote_src: yes
  loop:
    - consoles
    - console_libraries

- name: Fetch Kubernetes admin.conf for kubernetes_sd_configs
  slurp:
    src: /etc/kubernetes/admin.conf
  register: k8s_admin_conf
  delegate_to: "{{ groups.get('k8s_control_plane', []) | first | default(inventory_hostname) }}"
  when: groups.get('k8s_control_plane', []) | length > 0

- name: Write kubeconfig for Prometheus
  copy:
    dest: /etc/prometheus/kubeconfig
    content: "{{ k8s_admin_conf.content | b64decode }}"
    owner: prometheus
    group: prometheus
    mode: '0600'
  when: k8s_admin_conf.content | default('') | length > 0

- name: Extract CA and client certificates from kubeconfig
  shell: |
    python3 - <<'EOF'
    import base64, json
    with open('/etc/prometheus/kubeconfig') as f:
        cfg = json.load(f)
    cluster = cfg['clusters'][0]['cluster']
    user = cfg['users'][0]['user']
    writes = [
        ('/etc/prometheus/ca.crt', cluster.get('certificate-authority-data')),
        ('/etc/prometheus/client.crt', user.get('client-certificate-data')),
        ('/etc/prometheus/client.key', user.get('client-key-data')),
    ]
    for path, b64 in writes:
        with open(path, 'w') as f:
            f.write(base64.b64decode(b64).decode())
    EOF
    chown prometheus:prometheus /etc/prometheus/ca.crt /etc/prometheus/client.crt /etc/prometheus/client.key
    chmod 0640 /etc/prometheus/client.key
  args:
    executable: /bin/bash
  when: k8s_admin_conf.content | length > 0

- name: Deploy prometheus.yml
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
  notify: restart prometheus

- name: Deploy alert rules
  template:
    src: alert.rules.yml.j2
    dest: /etc/prometheus/alert.rules.yml
    owner: prometheus
    group: prometheus
  notify: restart prometheus

- name: Create Prometheus systemd service
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
          --config.file /etc/prometheus/prometheus.yml \
          --storage.tsdb.path /var/lib/prometheus/data \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles \
          --web.enable-lifecycle \
          --web.enable-admin-api
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Enable and start Prometheus
  systemd:
    name: prometheus
    enabled: yes
    state: started
    daemon_reload: yes
