---
- name: Include k8s-common
  include_role:
    name: k8s-common

- name: Check if kubeadm join already done
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_join_done

- name: Fetch join info from first control plane
  slurp:
    src: /tmp/k8s-cp-join-info.json
  register: join_info_file
  delegate_to: "{{ groups['k8s_control_plane'][0] }}"
  when: not k8s_join_done.stat.exists

- name: Parse join info
  set_fact:
    cp_join_info: "{{ join_info_file.content | b64decode | from_json }}"
  when: not k8s_join_done.stat.exists

- name: Join control plane
  command: "{{ cp_join_info.join_command }} --certificate-key {{ cp_join_info.cert_key }} --v=5"
  when: not k8s_join_done.stat.exists
  register: kubeadm_join_cp
  changed_when: kubeadm_join_cp.rc == 0

- name: Create .kube directory for ubuntu
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy admin.conf to ubuntu user
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu
    mode: '0644'
    remote_src: yes
