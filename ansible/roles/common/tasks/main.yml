---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - net-tools
      - iproute2
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - python3
      - python3-pip
      - python3-apt
      - unzip
      - git
      - jq
      - tcpdump
      - strace
      - sysstat
    state: present

- name: Set timezone to UTC
  timezone:
    name: UTC

- name: Populate /etc/hosts from inventory
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item]['ansible_host'] }} {{ item }}"
  loop: "{{ groups['all'] }}"

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  mount:
    name: swap
    fstype: swap
    state: absent

- name: Configure kernel modules for Kubernetes
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Configure sysctl for Kubernetes networking
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

- name: Apply sysctl settings
  command: sysctl --system

- name: Increase file descriptor limits
  copy:
    dest: /etc/security/limits.d/99-kubernetes.conf
    content: |
      * soft nofile 65536
      * hard nofile 65536
      root soft nofile 65536
      root hard nofile 65536

- name: Create journald drop-in directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Configure journald
  copy:
    dest: /etc/systemd/journald.conf.d/99-kubernetes.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      ForwardToSyslog=no
  notify: restart journald

- name: Install containerd
  apt:
    name: containerd
    state: present
  when: "'k8s' in group_names or 'docker' in group_names"

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Configure containerd
  copy:
    dest: /etc/containerd/config.toml
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri"]
        sandbox_image = "registry.k8s.io/pause:3.9"
        [plugins."io.containerd.grpc.v1.cri".containerd]
          snapshotter = "overlayfs"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
              SystemdCgroup = true
  notify: restart containerd
  when: "'k8s' in group_names or 'docker' in group_names"
