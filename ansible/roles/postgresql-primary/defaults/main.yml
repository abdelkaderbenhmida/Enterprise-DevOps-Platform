---
# postgresql-primary role defaults
postgresql_version: "15"
postgresql_packages:
  - postgresql-15
  - postgresql-client-15
  - postgresql-contrib-15

postgresql_config:
  wal_level: "replica"
  max_wal_senders: 10
  max_replication_slots: 10
  hot_standby: "on"
  wal_keep_size: "1GB"
  listen_addresses: "*"
  port: 5432

postgresql_pg_hba:
  - type: "local"
    database: "all"
    user: "postgres"
    address: ""
    method: "peer"
  - type: "local"
    database: "all"
    user: "all"
    address: ""
    method: "peer"
  - type: "host"
    database: "all"
    user: "all"
    address: "127.0.0.1/32"
    method: "md5"
  - type: "host"
    database: "all"
    user: "all"
    address: "::1/128"
    method: "md5"
  - type: "host"
    database: "replication"
    user: "replicator"
    address: "10.0.4.0/24"
    method: "md5"
  - type: "host"
    database: "all"
    user: "all"
    address: "10.0.3.0/24"
    method: "md5"
  - type: "host"
    database: "all"
    user: "all"
    address: "10.0.2.0/24"
    method: "md5"

postgresql_users:
  - name: "replicator"
    password: "{{ pg_replication_password }}"
    role_attr: "REPLICATION"
    state: "present"
  - name: "app1"
    password: "{{ pg_app1_password }}"
    db: "app1"
    priv: "ALL"
    state: "present"
  - name: "monitoring"
    password: "{{ pg_monitoring_password }}"
    role_attr: "LOGIN"
    state: "present"

postgresql_databases:
  - name: "app1"
    state: "present"
