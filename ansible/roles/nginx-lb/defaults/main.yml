---
# NGINX LB role defaults
nginx_version: "1.24.*"
nginx_packages:
  - nginx

nginx_config:
  worker_processes: "auto"
  worker_connections: 768
  keepalive_timeout: 65
  types_hash_max_size: 2048
  server_tokens: false
  gzip: true
  gzip_vary: true
  gzip_proxied: "any"
  gzip_comp_level: 6
  gzip_types:
    - "text/plain"
    - "text/css"
    - "application/json"
    - "application/javascript"
    - "text/xml"
    - "application/xml"
    - "application/xml+rss"
    - "text/javascript"

nginx_upstream:
  name: "k8s_ingress"
  lb_method: "least_conn"
  servers: []  # Populated dynamically from inventory
  max_fails: 3
  fail_timeout: "30s"

nginx_server:
  listen: 80
  server_name: "_"
  location: "/"
  proxy_pass: "http://k8s_ingress"
  health_endpoint: "/healthz"

nginx_ports:
  - 80
  - 443
